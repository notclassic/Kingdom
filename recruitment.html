<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Kingdom · Recruitment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#14161c; --ink-2:#4b5260; --muted:#8b91a0;
    --line:#e5e7ec; --line-2:#eef0f4; --accent:#14161c;
    --green:#0f7a45; --red:#c0392b;
    --li:#175cd3; --ind:#6d28d9; --tra:#0f8a4d; --lab:#b02aa0;
    --sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --tap:50px; --r:12px;
    --surface:#ffffff; --tabs-bg:#eaecf1; --toast-bg:#14161c; --toast-ink:#fff;
  }
  /* ---------- MODO OSCURO (botón corbata) ---------- */
  html[data-theme="dark"]{
    --bg:#0f1115; --card:#171a21; --surface:#171a21; --ink:#e8eaf0; --ink-2:#b4bac8; --muted:#7c8391;
    --line:#262a34; --line-2:#1e222b; --accent:#e8eaf0; --tabs-bg:#1c2028;
    --toast-bg:#e8eaf0; --toast-ink:#14161c;
    --li:#4d8ff0; --ind:#9b6bff; --tra:#3ec47a; --lab:#d75fc7;
    color-scheme:dark;
  }
  html[data-theme="dark"] .card.o-linkedin  {background:#141a26; border-color:#1f2b3f;}
  html[data-theme="dark"] .card.o-indeed    {background:#181528; border-color:#2b2442;}
  html[data-theme="dark"] .card.o-trabajando{background:#12201a; border-color:#1d3328;}
  html[data-theme="dark"] .card.o-laborum   {background:#1f1526; border-color:#35223f;}
  html[data-theme="dark"] .tab.active{box-shadow:none;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased; text-wrap:pretty;
  }
  a{color:var(--ink);}
  a:hover{color:var(--ink-2);}

  /* ---------- Barra superior ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  }
  .topbar-inner{max-width:1180px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .brand h1{
    font-size:1.22rem; margin:0; font-weight:600; letter-spacing:-.035em; line-height:1.1;
  }
  .brand .sub{
    font-family:var(--mono); font-size:.6rem; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); margin-top:5px;
  }
  .head-actions{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .head-actions a{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    min-height:40px; min-width:40px; padding:0 12px; border-radius:11px;
    font-size:.82rem; font-weight:500; text-decoration:none; color:var(--ink-2);
    background:var(--surface); border:1px solid var(--line); transition:background .15s,border-color .15s;
  }
  .head-actions a:active{background:var(--bg);}
  .xls{color:var(--tra) !important;}
  .theme-btn{
    display:inline-flex; align-items:center; justify-content:center;
    height:56px; padding:0 4px; border-radius:12px; line-height:0;
    background:transparent; border:none; cursor:pointer;
    transition:transform .15s, opacity .15s; flex-shrink:0;
  }
  .theme-btn:hover{opacity:.8;}
  .theme-btn:active{transform:scale(.94);}
  .theme-btn .tie{display:block; color:var(--ink);}
  .theme-btn:hover .tie{color:var(--ink-2);}

  .wrap{max-width:1180px; margin:0 auto; padding:16px 16px calc(48px + env(safe-area-inset-bottom));}

  /* ---------- Pestañas ---------- */
  .tabs{
    display:grid; grid-template-columns:repeat(3,1fr); gap:2px;
    background:var(--tabs-bg); padding:3px; border-radius:13px; margin-bottom:10px;
  }
  .tab{
    min-height:44px; padding:6px 4px; border:none; background:transparent; cursor:pointer;
    font-family:var(--sans); font-size:.88rem; font-weight:500; color:var(--ink-2);
    border-radius:10px; display:flex; align-items:center; justify-content:center; gap:5px;
    line-height:1.15; letter-spacing:-.01em; transition:background .18s, color .18s;
  }
  .tab.active{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(20,22,28,.06);}
  .tab .count{font-family:var(--mono); font-size:.7rem; font-weight:400; color:var(--muted);}
  .tab.active .count{color:var(--ink-2);}

  /* ---------- Buscador + filtro ---------- */
  .toolbar{display:flex; gap:8px; align-items:stretch; margin-bottom:18px; flex-wrap:wrap;}
  .toolbar input, .toolbar select{
    font-family:var(--sans); font-size:1rem; min-height:46px; padding:0 14px; width:100%;
    border:1px solid var(--line); border-radius:var(--r); background:var(--surface); color:var(--ink);
    outline:none; appearance:none; -webkit-appearance:none;
  }
  .toolbar input{flex:1 1 100%; min-width:0;}
  .toolbar input::placeholder{color:var(--muted);}
  .toolbar select{
    flex:1 1 140px; max-width:none; font-size:.88rem; font-weight:500; color:var(--ink-2); padding-right:32px;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 18px) 21px, calc(100% - 13px) 21px;
    background-size:5px 5px,5px 5px; background-repeat:no-repeat;
  }
  .toolbar input:focus, .toolbar select:focus{border-color:var(--ink); }

  /* ---------- Tarjetas ---------- */
  .card{
    position:relative; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:16px; margin-bottom:10px; overflow:hidden;
    transition:border-color .15s;
  }
  .card::before{content:""; display:none;}
  .card.o-linkedin::before{background:var(--li);}
  .card.o-indeed::before{background:var(--ind);}
  .card.o-trabajando::before{background:var(--tra);}
  .card.o-laborum::before{background:var(--lab);}

  .card .top{display:block;}
  .card .title{font-size:1.05rem; font-weight:600; line-height:1.3; margin:0; letter-spacing:-.022em;}
  .card .title a{color:var(--ink); text-decoration:none;}
  .card .title a::after{content:" ↗"; font-size:.78em; color:var(--muted); font-weight:400;}
  .card .company{font-size:.92rem; color:var(--ink-2); margin-top:5px;}
  .card .loc{font-size:.84rem; color:var(--muted); margin-top:2px;}
  .card .meta{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px;}
  .chip{
    font-family:var(--mono); font-size:.66rem; letter-spacing:.08em; text-transform:uppercase;
    padding:5px 9px; border-radius:7px; background:var(--line-2); color:var(--ink-2); white-space:nowrap;
  }
  .chip.src-linkedin, .chip.src-indeed, .chip.src-trabajando, .chip.src-laborum{
    color:#fff; font-weight:700; padding:0 10px;
    min-width:104px; height:24px; display:inline-flex; align-items:center; justify-content:center;
  }
  .chip.src-linkedin{background:var(--li);}
  .chip.src-indeed{background:var(--ind);}
  .chip.src-trabajando{background:var(--tra);}
  .chip.src-laborum{background:var(--lab);}
  .chip.date{background:transparent; color:var(--muted); padding-left:0;}
  .chip.reason{background:#fdeeee; color:var(--red);}
  .chip.applied{background:#e6f5ec; color:var(--tra);}

  /* ---------- Acciones ---------- */
  .actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;}
  .actions .btn{min-height:50px; font-size:.95rem; font-weight:600;}
  .actions:empty{display:none; margin:0;}
  .btn{
    font-family:var(--sans); font-size:.88rem; font-weight:500; letter-spacing:-.01em;
    min-height:var(--tap); padding:8px 10px; border-radius:11px; cursor:pointer;
    border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
    display:flex; align-items:center; justify-content:center; gap:6px; text-align:center; line-height:1.2;
    transition:background .15s, border-color .15s, transform .1s;
  }
  .btn:active{transform:scale(.985); background:var(--bg);}
  .btn::before{font-size:1.02em; line-height:1; color:var(--muted); flex:0 0 auto;}
  .btn.open, .btn.discard, .btn.block, .btn.rescue, .btn.apply{
    color:var(--ink-2); background:var(--surface); border-color:var(--line); font-weight:500;
  }
  .btn.discard::before{content:"\2715";}
  .btn.block::before{content:"\2298";}
  .btn.rescue::before{content:"\21BA";}
  .btn.open::before{content:"\2197";}
  .btn.apply::before{content:"\2713";}
  .btn:disabled{opacity:.45; cursor:default;}

  /* ---------- Estados ---------- */
  .state{
    text-align:center; padding:56px 20px; color:var(--muted); font-size:.92rem;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
  }
  .state .big{font-size:1.6rem; margin-bottom:8px; opacity:.7;}
  .state .btn{display:inline-flex; margin:14px auto 0; min-width:150px;}
  .spinner{
    width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--ink);
    border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 14px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Config (token) ---------- */
  .config{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px; max-width:420px; margin:30px auto;}
  .config h2{margin:0 0 6px; font-size:1.05rem; font-weight:600; letter-spacing:-.02em;}
  .config p{font-size:.88rem; color:var(--muted); margin:0 0 14px;}
  .config input{width:100%; min-height:46px; padding:0 14px; border:1px solid var(--line);
                border-radius:var(--r); font-size:1rem; outline:none; margin-bottom:12px; font-family:var(--sans);}
  .config input:focus{border-color:var(--ink);}
  .config button{width:100%; min-height:var(--tap); border:none; border-radius:11px; background:var(--ink);
                 color:#fff; font-size:.95rem; font-weight:600; cursor:pointer; font-family:var(--sans);}
  .config .err{color:var(--red); font-size:.85rem; margin-bottom:10px;}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(16px);
    background:var(--toast-bg); color:var(--toast-ink); padding:12px 18px; border-radius:11px;
    font-size:.88rem; opacity:0; pointer-events:none; transition:.22s; z-index:100;
    max-width:calc(100% - 32px); text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- Pantalla grande ---------- */
  @media (min-width:680px){
    .topbar{padding:18px 24px;}
    .brand h1{font-size:1.45rem;}
    .wrap{padding:22px 24px 64px;}
    /* pestañas y buscador centrados */
    .tabs{max-width:560px; margin:0 auto 16px;}
    .tab{font-size:.95rem; padding:11px 8px;}
    .toolbar{max-width:900px; margin:0 auto 16px;}
    .toolbar select{flex:0 0 240px; max-width:240px;}
    /* tarjetas: una sola fila arriba (cargo · empresa · origen · fecha),
       botones centrados abajo */
    .card{padding:20px 26px 18px; display:flex; flex-wrap:wrap; align-items:center; column-gap:16px; row-gap:6px;}
    .card:hover{border-color:#d3d7df;}
    .card .top{flex:1 1 auto; min-width:0; display:block;}
    .card .top > div{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;}
    .card .title{font-size:1.15rem; margin:0;}
    .card .title a:hover{color:var(--ink-2);}
    .card .company{margin-top:0; font-size:1rem;}
    .card .company::before{content:"·"; margin-right:10px; color:var(--muted);}
    .card .loc{flex-basis:100%; margin-top:2px;}
    /* origen y fecha a la derecha, en la misma fila */
    .card .meta{margin-top:0; flex:0 0 auto; margin-left:auto;}
    /* botones: fila completa, centrados y grandes */
    .actions{flex-basis:100%; display:flex; justify-content:center; flex-wrap:wrap; gap:10px; max-width:none; margin-top:12px;}
    .actions .btn{flex:0 0 auto; min-width:170px; padding:0 28px;}
    .btn{min-height:48px; font-size:.98rem; font-weight:600;}
    .btn:hover{background:var(--bg);}
    .head-actions a:hover{background:var(--bg);}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>Recruitment</h1>
      <div class="sub">Ofertas filtradas</div>
    </div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Modo oscuro / claro" title="Tocar la corbata: cambiar tema claro/oscuro">
      <svg class="tie" viewBox="0 0 24 24" width="52" height="52" aria-hidden="true">
        <path d="M9.5 3h5l-1.4 3.2h-2.2L9.5 3zm1.4 4.2h2.2l2.9 10.2L12 21.5 8 17.4l2.9-10.2z" fill="currentColor"/>
      </svg>
    </button>
    <div class="head-actions">
      <a class="xls" href="https://docs.google.com/spreadsheets/d/1STE-3G5-6fNOTuJrOEUqGJ48UiAmXJTuPd8RvlUY7_o/edit" target="_blank" rel="noopener" aria-label="Abrir Excel">▦</a>
      <a class="back" href="dashboard.html">← Kingdom</a>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- Panel -->
  <div id="panel" style="display:none;">
    <div class="tabs">
      <button class="tab active" id="tabOfertas" onclick="setTab('ofertas')">
        Ofertas <span class="count" id="cntOfertas"></span>
      </button>
      <button class="tab" id="tabPostuladas" onclick="setTab('postuladas')">
        Postuladas <span class="count" id="cntPostuladas"></span>
      </button>
      <button class="tab" id="tabDescartadas" onclick="setTab('descartadas')">
        Ocultas <span class="count" id="cntDescartadas"></span>
      </button>
    </div>

    <div class="toolbar">
      <input id="search" type="text" inputmode="search" placeholder="Buscar título o empresa…" oninput="render()">
      <select id="dias" onchange="cambiarDias()" title="Mostrar ofertas de los últimos…">
        <option value="1">Hoy</option>
        <option value="2">Últimos 2 días</option>
        <option value="3">Últimos 3 días</option>
        <option value="7">Últimos 7 días</option>
        <option value="15">Últimos 15 días</option>
      </select>
      <select id="origen" onchange="render()">
        <option value="todos">Todos los orígenes</option>
      </select>
    </div>

    <div id="list"></div>
  </div>

  <!-- Carga inicial -->
  <div id="loading" class="state">
    <div class="spinner"></div>
    Conectando con tus ofertas…
  </div>

</div>

<div id="toast"></div>

<script>
/* ===================== CONFIG ===================== */
const BRIDGE_URL = 'https://script.google.com/macros/s/AKfycbwdb0XiUcWS0VRPJ6ipHpP73I3qlfcmjlPIg7hTIDDL5ZvAvXdvIMRjoRTur3Lko5Z6/exec';
const TOKEN_KEY  = 'kingdom_recruitment_token';
const THEME_KEY  = 'kingdom_recruitment_theme';
// Tema: se aplica antes de pintar para no parpadear.
(function(){
  try{
    const t = localStorage.getItem(THEME_KEY);
    if(t==='dark') document.documentElement.setAttribute('data-theme','dark');
  }catch(e){}
})();
function toggleTheme(){
  const html = document.documentElement;
  const dark = html.getAttribute('data-theme')==='dark';
  if(dark) html.removeAttribute('data-theme'); else html.setAttribute('data-theme','dark');
  try{ localStorage.setItem(THEME_KEY, dark ? 'light' : 'dark'); }catch(e){}
}

/* ===================== ESTADO ===================== */
let TOKEN = 'Kingdom_popom';   // token fijo: entrás directo desde cualquier dispositivo
const estado = { listado:[], totalOfertas:null, hayMas:false, descartadas:null, descCargando:false, postuladas:null, postCargando:false, tab:'ofertas' };

/* ===================== JSONP (evita CORS) ===================== */
function jsonp(params){
  return new Promise((resolve, reject)=>{
    const cb = 'cb_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    let done = false;
    const timer = setTimeout(()=>{ if(!done){ cleanup(); reject(new Error('timeout')); } }, 90000);
    function cleanup(){ done=true; clearTimeout(timer); delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = (data)=>{ cleanup(); resolve(data); };
    const all = Object.assign({}, params, { token:TOKEN, callback:cb });
    const qs = Object.keys(all).map(k=> encodeURIComponent(k)+'='+encodeURIComponent(all[k])).join('&');
    s.src = BRIDGE_URL + '?' + qs;
    s.onerror = ()=>{ cleanup(); reject(new Error('No se pudo conectar con el puente.')); };
    document.body.appendChild(s);
  });
}

/* ===================== INICIO ===================== */
function init(){
  cargar();
}
function mostrarConfig(err){
  // Con token fijo no se usa, pero queda por compatibilidad si el token fuera inválido.
  document.getElementById('loading').innerHTML =
    '<div class="state"><div class="big">⚠️</div>'+(err||'Token inválido')+'</div>';
}

/* ===================== CARGAR DATOS ===================== */
const DIAS_KEY = 'kingdom_recruitment_dias';
const DIAS_DEFECTO = 3;   // por defecto, mostrar solo los últimos 3 días

// Lee de localStorage el rango de días elegido; si no hay, usa el default.
function diasElegidos(){
  try{ const v = parseInt(localStorage.getItem(DIAS_KEY), 10); if(v>0) return v; }catch(e){}
  return DIAS_DEFECTO;
}
// Al cambiar el menú, guarda la elección y recarga desde el puente.
function cambiarDias(){
  const sel = document.getElementById('dias');
  const v = sel ? sel.value : String(DIAS_DEFECTO);
  try{ localStorage.setItem(DIAS_KEY, v); }catch(e){}
  cargar();
}

async function cargar(){
  document.getElementById('loading').style.display='block';
  document.getElementById('panel').style.display='none';
  const dias = diasElegidos();
  const selDias = document.getElementById('dias');
  if(selDias) selDias.value = String(dias);
  try{
    // Solo las ofertas de los últimos N días, de la más nueva hacia atrás.
    const r = await jsonp({ action:'ofertas', dias:dias });
    if(!r || r.ok===false){
      if(r && r.error==='token_invalido'){
        mostrarConfig('El token del archivo no coincide con el del puente. Revisá que sean iguales.');
        return;
      }
      throw new Error((r && r.error) || 'respuesta vacía');
    }
    estado.listado = r.listado || [];
    estado.totalOfertas = r.total != null ? r.total : estado.listado.length;
    estado.descartadas = null;        // todavía no cargadas
    estado.descCargando = false;
    llenarOrigenes();
    document.getElementById('loading').style.display='none';
    document.getElementById('panel').style.display='block';
    render();
  }catch(err){
    document.getElementById('loading').innerHTML =
      '<div class="state"><div class="big">⚠️</div>No se pudieron cargar las ofertas.<br><small>'+
      escapar(String(err.message||err))+'</small><br><br>'+
      '<button class="btn" onclick="cargar()">Reintentar</button></div>';
  }
}

function llenarOrigenes(){
  const sel = document.getElementById('origen');
  const set = new Set();
  estado.listado.forEach(o=> o.origen && set.add(o.origen));
  // limpiar menos la primera opción
  sel.length = 1;
  [...set].sort().forEach(o=>{
    const opt = document.createElement('option'); opt.value=o;
    opt.textContent = String(o).replace(/\s*\(gmail\)\s*/ig,' ').trim() || o;
    sel.appendChild(opt);
  });
}

/* ===================== PESTAÑAS ===================== */
function setTab(t){
  estado.tab = t;
  document.getElementById('tabOfertas').classList.toggle('active', t==='ofertas');
  document.getElementById('tabPostuladas').classList.toggle('active', t==='postuladas');
  document.getElementById('tabDescartadas').classList.toggle('active', t==='descartadas');
  document.getElementById('origen').style.display = (t==='ofertas') ? '' : 'none';
  document.getElementById('dias').style.display = (t==='ofertas') ? '' : 'none';
  // La primera vez que entrás a Descartadas o Postuladas, las traemos del puente.
  if(t==='descartadas' && estado.descartadas===null && !estado.descCargando){
    cargarDescartadas();
    return;
  }
  if(t==='postuladas' && estado.postuladas===null && !estado.postCargando){
    cargarPostuladas();
    return;
  }
  render();
}

async function cargarPostuladas(){
  estado.postCargando = true;
  render();
  try{
    const r = await jsonp({ action:'postuladas' });
    if(!r || r.ok===false) throw new Error((r && r.error) || 'error');
    estado.postuladas = r.postuladas || [];
  }catch(err){
    estado.postuladas = null;
    toast('No se pudieron cargar las postuladas: '+(err.message||err));
  }
  estado.postCargando = false;
  render();
}

async function cargarDescartadas(){
  estado.descCargando = true;
  render();  // muestra "cargando…"
  try{
    const r = await jsonp({ action:'descartadas' });
    if(!r || r.ok===false) throw new Error((r && r.error) || 'error');
    estado.descartadas = r.descartadas || [];
  }catch(err){
    estado.descartadas = null;
    toast('No se pudieron cargar las descartadas: '+(err.message||err));
  }
  estado.descCargando = false;
  render();
}

/* ===================== RENDER ===================== */
function render(){
  document.getElementById('cntOfertas').textContent = '· ' + estado.listado.length;
  document.getElementById('cntPostuladas').textContent =
    (estado.postuladas===null) ? '' : ('· ' + estado.postuladas.length);
  document.getElementById('cntDescartadas').textContent =
    (estado.descartadas===null) ? '' : ('· ' + estado.descartadas.length);

  const q = (document.getElementById('search').value||'').trim().toLowerCase();
  const origen = document.getElementById('origen').value;
  const cont = document.getElementById('list');
  cont.innerHTML = '';

  // Pestaña Descartadas: estados especiales
  if(estado.tab==='descartadas'){
    if(estado.descCargando){
      cont.innerHTML = '<div class="state"><div class="spinner"></div>Cargando descartadas…</div>';
      return;
    }
    if(estado.descartadas===null){
      cont.innerHTML = '<div class="state"><div class="big">🗂️</div>Tocá de nuevo "Descartadas" para cargarlas.</div>';
      return;
    }
  }

  // Pestaña Postuladas: estados especiales
  if(estado.tab==='postuladas'){
    if(estado.postCargando){
      cont.innerHTML = '<div class="state"><div class="spinner"></div>Cargando postuladas…</div>';
      return;
    }
    if(estado.postuladas===null){
      cont.innerHTML = '<div class="state"><div class="big">👔</div>Tocá de nuevo "Postuladas" para cargarlas.</div>';
      return;
    }
  }

  let datos = (estado.tab==='ofertas') ? estado.listado
            : (estado.tab==='postuladas') ? (estado.postuladas||[])
            : (estado.descartadas||[]);

  datos = datos.filter(o=>{
    if(estado.tab==='ofertas' && origen!=='todos' && o.origen!==origen) return false;
    if(q){
      const txt = ((o.titulo||'')+' '+(o.empresa||'')).toLowerCase();
      if(!txt.includes(q)) return false;
    }
    return true;
  });

  if(datos.length===0){
    cont.innerHTML = '<div class="state"><div class="big">🗂️</div>'+
      (estado.tab==='ofertas' ? 'No hay ofertas que coincidan.'
       : estado.tab==='postuladas' ? 'Todavía no registraste postulaciones.'
       : 'No hay descartadas para mostrar.')+'</div>';
    return;
  }

  datos.forEach(o=> cont.appendChild(
    estado.tab==='ofertas' ? cardOferta(o)
    : estado.tab==='postuladas' ? cardPostulada(o)
    : cardDescartada(o)
  ));
}

function chipOrigen(origen){
  const o = (origen||'').toLowerCase();
  let cls = '';
  if(o.includes('linkedin')) cls='src-linkedin';
  else if(o.includes('indeed')) cls='src-indeed';
  else if(o.includes('trabajando')) cls='src-trabajando';
  else if(o.includes('laborum')) cls='src-laborum';
  const etiqueta = String(origen||'—').replace(/\s*\(gmail\)\s*/ig,' ').trim() || '—';
  return '<span class="chip '+cls+'">'+escapar(etiqueta)+'</span>';
}

// clase de color de la tarjeta según el origen (franja izquierda)
function claseOrigen(origen){
  const o = (origen||'').toLowerCase();
  if(o.includes('linkedin')) return 'card o-linkedin';
  if(o.includes('indeed')) return 'card o-indeed';
  if(o.includes('trabajando')) return 'card o-trabajando';
  if(o.includes('laborum')) return 'card o-laborum';
  return 'card';
}

function linkOferta(o){
  const origen = (o.origen||'').toLowerCase();
  // Laborum no trae link directo usable, así que armamos una búsqueda en
  // laborum.cl por el cargo, ordenada por más recientes.
  if(origen.indexOf('laborum')!==-1){
    const cargo = (o.titulo||'').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')  // saca acentos
      .replace(/[^a-z0-9\s-]/g,'')                        // saca símbolos
      .trim().replace(/\s+/g,'-');                        // espacios -> guiones
    if(!cargo) return 'https://www.laborum.cl/empleos.html?recientes=true';
    return 'https://www.laborum.cl/empleos-busqueda-'+cargo+'.html?recientes=true';
  }
  // Los demás (Indeed, LinkedIn, Trabajando) usan su link real.
  return o.link || '';
}

function cardOferta(o){
  const div = document.createElement('div');
  div.className=claseOrigen(o.origen);
  const url = linkOferta(o);
  div.innerHTML =
    '<div class="top"><div>'+
      '<p class="title">'+(url?'<a href="'+escapar(url)+'" target="_blank" rel="noopener">'+escapar(o.titulo||'(sin título)')+'</a>':escapar(o.titulo||'(sin título)'))+'</p>'+
      '<div class="company">'+escapar(o.empresa||'—')+'</div>'+
      (o.ubicacion?'<div class="loc">📍 '+escapar(o.ubicacion)+'</div>':'')+
    '</div></div>'+
    '<div class="meta">'+chipOrigen(o.origen)+
      (o.fecha?'<span class="chip date">'+escapar(o.fecha)+'</span>':'')+
    '</div>'+
    '<div class="actions">'+

      '<button class="btn apply" onclick="accionPostular(this,\''+jsAttr(o.link)+'\')">Postulé</button>'+
      '<button class="btn discard" onclick="accionDescartar(this,\''+jsAttr(o.link)+'\')">Ocultar</button>'+
      '<button class="btn block" onclick="accionBloquearEmpresa(this,\''+jsAttr(o.empresa)+'\',\''+jsAttr(o.link)+'\')">Empresa</button>'+
      '<button class="btn block" onclick="accionBloquearPalabra(this,\''+jsAttr(o.link)+'\')">Palabra</button>'+
    '</div>';
  return div;
}

function cardPostulada(o){
  const div = document.createElement('div');
  div.className=claseOrigen(o.origen);
  const url = linkOferta(o);
  div.innerHTML =
    '<div class="top"><div>'+
      '<p class="title">'+(url?'<a href="'+escapar(url)+'" target="_blank" rel="noopener">'+escapar(o.titulo||'(sin título)')+'</a>':escapar(o.titulo||'(sin título)'))+'</p>'+
      '<div class="company">'+escapar(o.empresa||'—')+'</div>'+
      (o.ubicacion?'<div class="loc">📍 '+escapar(o.ubicacion)+'</div>':'')+
    '</div></div>'+
    '<div class="meta">'+chipOrigen(o.origen)+
      (o.fechaPostulacion?'<span class="chip applied">Postulado: '+escapar(o.fechaPostulacion)+'</span>':'')+
      (o.fecha?'<span class="chip date">Oferta: '+escapar(o.fecha)+'</span>':'')+
    '</div>'+
    '<div class="actions">'+

    '</div>';
  return div;
}

function cardDescartada(o){
  const div = document.createElement('div');
  div.className=claseOrigen(o.origen);
  const url = linkOferta(o);
  div.innerHTML =
    '<div class="top"><div>'+
      '<p class="title">'+(url?'<a href="'+escapar(url)+'" target="_blank" rel="noopener">'+escapar(o.titulo||'(sin título)')+'</a>':escapar(o.titulo||'(sin título)'))+'</p>'+
      '<div class="company">'+escapar(o.empresa||'—')+'</div>'+
      (o.ubicacion?'<div class="loc">📍 '+escapar(o.ubicacion)+'</div>':'')+
    '</div></div>'+
    '<div class="meta">'+
      (o.motivo?'<span class="chip reason">'+escapar(o.motivo)+'</span>':'')+
      (o.fecha?'<span class="chip date">'+escapar(o.fecha)+'</span>':'')+
    '</div>'+
    '<div class="actions">'+

      '<button class="btn rescue" onclick="accionRescatar(this,\''+jsAttr(o.link)+'\')">Rescatar</button>'+
    '</div>';
  return div;
}

/* ===================== ACCIONES ===================== */
// Modo NORMAL (bloqueos): espera la respuesta antes de quitar la tarjeta.
async function correr(btn, params, okMsg, alExito){
  const fila = btn.closest('.card');
  const botones = fila.querySelectorAll('button, a.btn');
  botones.forEach(b=> b.disabled=true);
  btn.textContent = '…';
  try{
    const r = await jsonp(params);
    if(!r || r.ok===false){
      if(r && r.error==='token_invalido'){ toast('Token inválido: revisá que coincida con el del puente.'); botones.forEach(b=> b.disabled=false); return; }
      throw new Error((r && r.error) || 'error');
    }
    toast(okMsg);
    if(alExito) alExito();
    fila.style.transition='.3s'; fila.style.opacity='0'; fila.style.height=fila.offsetHeight+'px';
    setTimeout(()=>{ render(); }, 280);
  }catch(err){
    toast('No se pudo: '+(err.message||err));
    botones.forEach(b=> b.disabled=false);
    render();
  }
}

// Modo OPTIMISTA (Ocultar / Postulé): la tarjeta se va AL INSTANTE y la
// llamada al puente sigue por detrás. Si falla, la oferta vuelve con aviso.
// Así no esperás los ~4s de Apps Script en cada toque.
function correrOptimista(btn, params, okMsg, aplicar, deshacer){
  const fila = btn.closest('.card');
  // 1) reflejar el cambio ya
  aplicar();
  fila.style.transition='.25s'; fila.style.opacity='0'; fila.style.transform='translateX(20px)';
  setTimeout(()=>{ render(); }, 200);
  toast(okMsg);
  // 2) mandar al puente en segundo plano
  jsonp(params).then(r=>{
    if(!r || r.ok===false){
      const e = (r && r.error) || 'error';
      if(e==='token_invalido') toast('Token inválido: revisá que coincida con el del puente.');
      else toast('No se pudo guardar, la oferta volvió: '+e);
      deshacer(); render();
    }
  }).catch(err=>{
    toast('Sin conexión, la oferta volvió: '+(err.message||err));
    deshacer(); render();
  });
}

function accionPostular(btn, link){
  const i = estado.listado.findIndex(o=>o.link===link);
  if(i<0) return;
  const oferta = estado.listado[i];
  correrOptimista(btn, {action:'postular', link}, 'Postulación registrada 👔',
    ()=>{
      estado.listado.splice(i,1);
      if(estado.postuladas!==null){
        estado.postuladas.unshift(Object.assign({}, oferta, { fechaPostulacion: new Date().toISOString().slice(0,10) }));
      }
    },
    ()=>{
      estado.listado.splice(i,0,oferta);
      if(estado.postuladas!==null){ const j=estado.postuladas.findIndex(o=>o.link===link); if(j>=0) estado.postuladas.splice(j,1); }
    }
  );
}

function accionDescartar(btn, link){
  // Sin confirmación: es reversible con "Rescatar" en Descartadas.
  const i = estado.listado.findIndex(o=>o.link===link);
  if(i<0) return;
  const oferta = estado.listado[i];
  correrOptimista(btn, {action:'descartar', link}, 'Oferta ocultada',
    ()=>{ estado.listado.splice(i,1); },
    ()=>{ estado.listado.splice(i,0,oferta); }
  );
}

function accionBloquearEmpresa(btn, empresa, link){
  if(!empresa){ toast('Esta oferta no tiene empresa para bloquear.'); return; }
  if(!confirm('Bloquear "'+empresa+'": no te volverán a llegar ofertas de esta empresa. ¿Confirmás?')) return;
  const i = estado.listado.findIndex(o=>o.link===link);
  correr(btn, {action:'bloquearEmpresa', empresa, link}, 'Empresa bloqueada', ()=>{ if(i>=0) estado.listado.splice(i,1); });
}

function accionBloquearPalabra(btn, link){
  const palabra = prompt('Escribí la palabra a bloquear (cuidado: bloquea TODA oferta cuyo título la contenga). Por ejemplo: práctica');
  if(palabra===null) return;
  const p = palabra.trim();
  if(!p){ return; }
  if(!confirm('Bloquear la palabra "'+p+'": no llegarán ofertas con esa palabra en el título. ¿Confirmás?')) return;
  const i = estado.listado.findIndex(o=>o.link===link);
  correr(btn, {action:'bloquearPalabra', palabra:p, link}, 'Palabra bloqueada', ()=>{ if(i>=0) estado.listado.splice(i,1); });
}

function accionRescatar(btn, link){
  const i = estado.descartadas.findIndex(o=>o.link===link);
  correr(btn, {action:'rescatar', link}, 'Oferta rescatada al Listado', ()=>{ if(i>=0) estado.descartadas.splice(i,1); });
}

/* ===================== HELPERS ===================== */
function escapar(t){
  return String(t==null?'':t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function jsAttr(t){ return String(t==null?'':t).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}

/* arrancar */
init();
